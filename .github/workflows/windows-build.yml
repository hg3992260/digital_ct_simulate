name: windows-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build DSW_CT (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # All build parameters live in scripts/build_windows.ps1, NOT here.
      # Reason: this file is gated behind GitHub's 'workflow' OAuth scope, so every
      # one-line change needs a manual web edit, while repo scripts can just be pushed.
      # The script handles: CUDA runtime collection, assets/LOGO.jpg -> assets/logo.ico,
      # --icon, --copy-metadata imageio+lazy_loader, PyInstaller onedir packaging, and a
      # frozen-environment self-test (real imports + actually constructing a LEAP engine).
      - name: Build + frozen self-test
        shell: pwsh
        run: pwsh -File scripts/build_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSW_CT_Windows
          path: dist/DSW_CT
          retention-days: 30
